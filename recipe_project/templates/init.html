<!DOCTYPE html> <!-- 문서형식선언명령어-->
<html>
    <head> <!-- 화면에 안보임, 웹 브라우저나 검색 엔진이 알아야할 설정 정보 -->
        <meta charset="UTF-8"> <!-- 문서의 부가 정보, 문자 인코딩 규칙 -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>자레추</title> <!-- 브라우저 탭 상단에 표시되는 제목 -->
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">  <!-- CSS 스타일시트 파일 연결 -->

            <div class="button-group"> 
                <a href="/select_ingredients" class="btn-link">
                 <!-- a: 하이퍼링크 태그, 뒤에 주소 (flask서버에 작성된 @app.route( )해당 파이썬 코드 실행 -->
                    <span class="btn btn-primary">가지고 있는 재료</span>
                </a>
                
                <a href="/recipe_list" class="btn-link">
                    <span class="btn btn-secondary">추천 레시피 보기</span>

                <a href="/add_recipe" class="btn-link">

                </a>
