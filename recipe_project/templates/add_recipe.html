<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>레시피 추가하기</title>
</head>
<body>
    <h1>🍳 나만의 자취 레시피 등록</h1>
    
    <form action="/add_recipe" method="POST">
        <p>
            <strong>레시피명:</strong><br>
            <input type="text" name="recipe_name" placeholder="예: 간장계란밥" required>
        </p>
        <p>
            <strong>재료:</strong><br>
            <input type="text" name="ingredients" placeholder="예: 계란 1개, 간장 1스푼" required>
        </p>
        <p>
            <strong>조리도구:</strong><br>
            <input type="text" name="tool" placeholder="예: 가스레인지, 프라이팬">
        </p>
        <p>
            <strong>식사/간식:</strong><br>
            <select name="category">
                <option value="식사">식사</option>
                <option value="간식">간식</option>
            </select>
        </p>
        <p>
            <strong>참고 링크 (또는 레시피 설명):</strong><br>
            <input type="text" name="link" placeholder="유튜브 링크 등을 적어주세요">
        </p>
        
        <button type="submit">DB에 등록하기</button>
    </form>
    
    <br>
    <a href="/">🏠 메인 화면으로 돌아가기</a>
</body>
</html>
